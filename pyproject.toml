[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythond"
version = "0.5.0"
description = "Persistent Python sessions. Code in, result out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["daemon", "repl", "python", "shell", "ai", "agent", "pty", "persistent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
]
dependencies = []

[project.scripts]
pythond = "pythond:main"
pysh = "pythond:pysh_main"
pyctl = "pythond:pyctl_main"

[project.urls]
Homepage = "https://pythond.sh"
Repository = "https://github.com/rangersui/pythond"

[tool.hatch.build.targets.wheel]
only-include = ["pythond.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/SKILL.md",
    "/docs/index.html",
    "/pyproject.toml",
    "/pythond.py",
    "/test_pythond.py",
]
